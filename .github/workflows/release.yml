# On a version tag (v*): build the macOS DMGs on a macOS runner and attach them to a GitHub Release.
# Manual runs (workflow_dispatch) build the DMG and upload it as a workflow artifact only.
name: Release DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Build DMGs (arm64 + x64, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: echo-thief-dmg
          path: release/*.dmg
          if-no-files-found: error
      - name: Attach DMGs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
