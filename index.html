<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Echo Thief - a stealth puzzle where you can only see by making sound." />
    <title>Echo Thief</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cg fill='none' stroke='%2373eff7' stroke-width='1'%3E%3Crect x='6' y='6' width='4' height='4'/%3E%3Crect x='3' y='3' width='10' height='10'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; line-height: 0; }
      #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; cursor: crosshair; }
      #scan { position: absolute; inset: 0; pointer-events: none; display: none; }
      #scan.on {
        display: block;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--px, 3px) * 0.5), rgba(0,0,0,0.38) calc(var(--px, 3px) * 0.5), rgba(0,0,0,0.38) var(--px, 3px));
        box-shadow: inset 0 0 60px rgba(0,0,0,0.55);
      }
      noscript { color: #94b0c2; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="320" height="180"></canvas>
      <div id="scan"></div>
    </div>
    <noscript>Echo Thief needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
